# ─────────────────────────────────────────────────────────────────────────────
# Spring AI – MCP Server (Streamable HTTP transport, MCP spec 2025-03-26)
#
# The server runs as a standard Spring Boot web application on port 8080.
# MCP clients connect to POST/GET /mcp and must present an Okta JWT.
# ────────────────────────────────────────────────────────────────────────────
spring.ai.mcp.server.name=okta-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.description=Okta User and Group Management MCP Server

# HTTP transport: Streamable HTTP (MCP SDK 0.9.0+ via Spring AI 1.0.0-RC1)
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.type=SYNC

# Run as a standard web application (Tomcat on port 8080)
spring.main.web-application-type=servlet
spring.main.banner-mode=off
# Allow our mcpServerJsonMapper bean to override the autoconfigured one
spring.main.allow-bean-definition-overriding=true

# ─────────────────────────────────────────────────────────────────────────────
# Okta – Auth (mirrors Python OktaAuthManager env vars)
#
# Production (private key JWT / client_credentials):
#   OKTA_ORG_URL, OKTA_CLIENT_ID, OKTA_PRIVATE_KEY, OKTA_KEY_ID, OKTA_SCOPES
#
# Dev / SSWS fallback:
#   OKTA_ORG_URL, OKTA_CLIENT_TOKEN
# ─────────────────────────────────────────────────────────────────────────────
okta.client.orgUrl=${OKTA_ORG_URL:https://your-org.okta.com}
okta.client.clientId=${OKTA_CLIENT_ID:}
okta.client.privateKey=${OKTA_PRIVATE_KEY:}
okta.client.keyId=${OKTA_KEY_ID:}
okta.client.scopes=${OKTA_SCOPES:okta.users.manage okta.users.read okta.groups.manage okta.groups.read}
okta.client.token=${OKTA_CLIENT_TOKEN:}

# ─────────────────────────────────────────────────────────────────────────────
# OIDC / Authorization Server
#
# The issuer URI of the Okta Custom Authorization Server that MCP clients
# obtain access tokens from. Used for:
#   1. JWT validation (spring.security.oauth2.resourceserver.jwt.issuer-uri)
#   2. /.well-known/oauth-authorization-server discovery endpoint
# ────────────────────────────────────────────────────────────────────────────
okta.auth.issuer-uri=${OKTA_ISSUER_URI:https://okta-mcp-server.oktapreview.com/oauth2/default}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER_URI:https://okta-mcp-server.oktapreview.com/oauth2/default}

# ─────────────────────────────────────────────────────────────────────────────
# UI – Browser SPA (PKCE Authorization Code flow)
#
# Register an Okta SPA application and set its Client ID below.
# The redirect URI must be added to that app's allowed redirect URIs in Okta.
#   OKTA_UI_CLIENT_ID  – Client ID of the SPA app in Okta
#   OKTA_UI_SCOPES     – Space-separated scopes the UI will request
# ─────────────────────────────────────────────────────────────────────────────
okta.ui.clientId=${OKTA_UI_CLIENT_ID:}
okta.ui.scopes=${OKTA_UI_SCOPES:openid profile email}

# Canonical URI of this MCP server — used as OAuth resource identifier per RFC 8707.
# Clients include resource=<this> in authorize + token requests so tokens are audience-bound.
# Must match what's registered in Okta if audience validation is enabled.
okta.resource.uri=${OKTA_RESOURCE_URI:http://127.0.0.1:8081/sse}

# Base URL of this MCP server — advertised as the proxy AS in /.well-known/oauth-protected-resource.
# VS Code discovers this URL and fetches /.well-known/oauth-authorization-server from it.
# Use 127.0.0.1 (not localhost) so VS Code's loopback redirect handling works correctly.
okta.server.base-url=${OKTA_SERVER_BASE_URL:http://127.0.0.1:8081}

# ─────────────────────────────────────────────────────────────────────────────
# Option 1 POC — Audience validation (POC criteria #2)
#
# When true, the JWT decoder rejects tokens whose aud claim does not contain
# okta.resource.uri. Set to false during initial testing to see what Okta
# returns before configuring the Custom AS claim policy.
# ─────────────────────────────────────────────────────────────────────────────
okta.resource.uri.audience.validate=${OKTA_AUDIENCE_VALIDATE:false}

# ─────────────────────────────────────────────────────────────────────────────
# Option 2 POC — XAA Cross-Org Token Exchange (POC criteria #1–4)
#
# Org 2 (okta-mcp-server.oktapreview.com) — Okta's hosting org.
# The "Okta Hosted MCP" app lives here and issues XAA-exchanged tokens.
#
#   OKTA_XAA_TOKEN_ENDPOINT — token endpoint of Org 2's Custom AS
#   OKTA_XAA_CLIENT_ID      — client ID of the "Okta Hosted MCP" app in Org 2
#   OKTA_XAA_CLIENT_SECRET  — client secret (or use private key JWT for prod)
#   OKTA_XAA_ISSUER_URI     — issuer URI of Org 2's Custom AS (for JWT validation)
# ─────────────────────────────────────────────────────────────────────────────
okta.xaa.token-endpoint=${OKTA_XAA_TOKEN_ENDPOINT:https://okta-mcp-server.oktapreview.com/oauth2/default/v1/token}
okta.xaa.client-id=${OKTA_XAA_CLIENT_ID:}
okta.xaa.client-secret=${OKTA_XAA_CLIENT_SECRET:}
okta.xaa.issuer-uri=${OKTA_XAA_ISSUER_URI:https://okta-mcp-server.oktapreview.com/oauth2/default}

# ────────────────────────────────────────────────────────────────────────────
# Logging – logback-spring.xml routes all output to stderr
# ────────────────────────────────────────────────────────────────────────────
logging.level.com.okta.mcp=INFO
logging.level.org.springframework.ai=INFO
logging.level.com.okta.sdk=WARN
# Show OIDC auth decisions at INFO — set to DEBUG for full Spring Security filter trace
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO

# ────────────────────────────────────────────────────────────────────────────
# Spring AI MCP — disable the built-in HTTP transport that conflicts with our
# custom McpStreamableHttpController.
#
# Spring AI's McpWebMvcServerAutoConfiguration registers a RouterFunction at:
#   GET  /sse          (sseEndpoint default = /sse)
#   POST /mcp/message  (sseMessageEndpoint default = /mcp/message)
#
# The RouterFunction has higher Spring MVC priority than @GetMapping, so
# Spring AI's GET /sse handler wins over ours. When VS Code calls
# _attachStreamableBackchannel() → GET /sse after initialize, Spring AI's
# handler returns an old-style SSE "endpoint" event pointing to /mcp/message.
# VS Code switches to legacy SSE mode, loses its session ID, and restarts
# the entire auth loop.
#
# We handle all MCP transport directly in McpStreamableHttpController and
# access tools via our own ToolCallbackProvider bean — Spring AI's HTTP
# transport layer is not needed.
# ────────────────────────────────────────────────────────────────────────────
spring.autoconfigure.exclude=\
  org.springframework.ai.mcp.server.autoconfigure.McpWebMvcServerAutoConfiguration,\
  org.springframework.ai.mcp.server.autoconfigure.McpServerAutoConfiguration
