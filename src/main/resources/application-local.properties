# ─────────────────────────────────────────────────────────────────────────────
# Local profile  (activate with --spring.profiles.active=local)
#
# Override properties here for local dev without touching application.properties.
# JWT validation remains FULLY ACTIVE — a real Okta token is required.
#
# Required env vars (export before running):
#   OKTA_ORG_URL       – e.g. https://dev-123456.okta.com
#   OKTA_CLIENT_TOKEN  – SSWS API token (Security → API → Tokens in Okta Admin)
#   OKTA_ISSUER_URI    – e.g. https://dev-123456.okta.com/oauth2/default
#   OKTA_UI_CLIENT_ID  – Client ID of your Okta SPA app (for PKCE browser flow)
# ─────────────────────────────────────────────────────────────────────────────

# Verbose Spring Security logging in local dev (set to WARN for prod)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
